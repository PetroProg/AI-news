<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#090d18">
  <meta name="background-color" content="#090d18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI News">
  <meta name="application-name" content="AI News">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

  <!-- Tailwind CSS via CDN -->

  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' }
            }
          }
        }
      };
    }
  </script>

  <link rel="stylesheet" href="/css/style.css?v=2026_11_22_v3">
</head>
<body class="antialiased selection:bg-sky-500 selection:text-white overflow-x-hidden">

  <!-- ========================================== -->
  <!-- STICKY TOP APP BAR                         -->
  <!-- ========================================== -->
  <header class="sticky top-0 z-30 glass-panel border-b border-slate-800/80 bg-slate-950/92 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-3.5 sm:px-6 py-2.5 sm:py-3 flex items-center justify-between gap-2">

      <!-- Brand Logo (tap -> Home Portal) -->
      <button id="brand-home-link" type="button" class="flex items-center gap-2.5 text-left group">
        <div class="relative flex items-center justify-center w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-teal-400 p-[1px] shadow-lg shadow-sky-500/20 shrink-0">
          <div class="w-full h-full bg-slate-950 rounded-2xl flex items-center justify-center">
            <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
            </svg>
          </div>
          <span class="absolute -top-1 -right-1 flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-lg sm:text-xl font-black text-white tracking-tight font-heading">AI<span class="text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400">News</span></span>
          <span id="app-connection-badge" class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">Live</span>
        </div>
      </button>

      <!-- Desktop Navigation (>= 768px) -->
      <nav class="desktop-nav items-center gap-1 p-1 rounded-2xl bg-slate-900/90 border border-slate-800">
        <button type="button" data-nav="home" class="desktop-nav-btn">
          <span>🏠</span><span>Витрина</span>
        </button>
        <button type="button" data-nav="categories" class="desktop-nav-btn">
          <span>🗂️</span><span>Категории</span>
        </button>
        <button type="button" data-nav="digest" class="desktop-nav-btn">
          <span>🔥</span><span>Дайджест</span>
        </button>
        <button type="button" data-nav="settings" class="desktop-nav-btn">
          <span>⚙️</span><span>Настройки</span>
        </button>
      </nav>

      <!-- Right Action: PWA Install -->
      <div class="flex items-center gap-2">
        <button id="pwa-install-btn" type="button"
          class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-sky-500/20 to-indigo-500/20 hover:from-sky-500/35 hover:to-indigo-500/35 text-sky-300 border border-sky-500/40 flex items-center gap-1.5"
          title="Установить AI News на устройство">
          <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
          </svg>
          <span class="hidden sm:inline">Приложение</span>
          <span class="sm:hidden">PWA</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- DYNAMIC PAGE VIEWPORT                      -->
  <!-- ========================================== -->
  <main id="app-viewport" class="max-w-7xl mx-auto px-3 sm:px-6 pt-4 sm:pt-6">
    <!-- Rendered dynamically by router & view modules -->
  </main>

  <!-- ========================================== -->
  <!-- MOBILE BOTTOM NAVIGATION BAR (< 768px)     -->
  <!-- ========================================== -->
  <nav class="mobile-nav mobile-bottom-bar px-2 py-1.5 items-center justify-around gap-1" aria-label="Мобильная навигация">
    <button type="button" data-nav="home" class="mobile-nav-btn">
      <span class="text-lg leading-none">🏠</span>
      <span class="text-[10px] mt-0.5">Витрина</span>
    </button>
    <button type="button" data-nav="categories" class="mobile-nav-btn">
      <span class="text-lg leading-none">🗂️</span>
      <span class="text-[10px] mt-0.5">Категории</span>
    </button>
    <button type="button" data-nav="digest" class="mobile-nav-btn">
      <span class="text-lg leading-none">🔥</span>
      <span class="text-[10px] mt-0.5">Дайджест</span>
    </button>
    <button type="button" data-nav="settings" class="mobile-nav-btn">
      <span class="text-lg leading-none">⚙️</span>
      <span class="text-[10px] mt-0.5">Настройки</span>
    </button>
  </nav>

  <!-- ========================================== -->
  <!-- MOBILE CATEGORY BOTTOM-SHEET DRAWER        -->
  <!-- ========================================== -->
  <div id="category-sheet-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-md transition-opacity duration-200 opacity-0">
    <div class="glass-panel w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl border border-slate-700/80 p-4 sm:p-5 max-h-[85vh] flex flex-col gap-3.5 shadow-2xl" onclick="event.stopPropagation()">
      <div class="w-10 h-1 bg-slate-700 rounded-full mx-auto sm:hidden"></div>
      <div class="flex items-center justify-between border-b border-slate-800/80 pb-2.5">
        <div>
          <h3 class="text-base font-black text-white font-heading">🗂️ Выберите категорию</h3>
          <p class="text-[11px] text-slate-400">Быстрый переход к отдельной странице</p>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="category-sheet-settings-btn" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-sky-300">⚙️</button>
          <button id="category-sheet-close-btn" type="button" class="px-2.5 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-slate-300">✕</button>
        </div>
      </div>
      <div id="category-sheet-content" class="overflow-y-auto space-y-4 pr-1 pb-2"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- DELETE CONFIRMATION MODAL                  -->
  <!-- ========================================== -->
  <div id="delete-confirm-modal" class="fixed inset-0 z-[9999] hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div class="glass-panel rounded-3xl max-w-md w-full p-6 border border-rose-500/30 shadow-2xl text-center">
      <div class="w-12 h-12 rounded-2xl bg-rose-500/15 border border-rose-500/30 text-rose-400 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
      </div>
      <h3 id="delete-modal-title" class="text-lg font-bold text-white mb-2 font-heading">Удалить?</h3>
      <div id="delete-modal-snippet" class="p-3 rounded-2xl bg-slate-900/90 border border-slate-800 text-xs text-slate-300 mb-3 text-left line-clamp-3"></div>
      <p id="delete-modal-desc" class="text-xs text-slate-400 mb-5">Запись будет навсегда стерта из базы данных.</p>
      <div class="flex items-center gap-3">
        <button type="button" id="delete-modal-cancel" class="flex-1 py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs border border-slate-700">Отмена</button>
        <button type="button" id="delete-modal-confirm" class="flex-1 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs border border-rose-500/40"><span>Удалить</span></button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MEDIA ZOOM LIGHTBOX MODAL                  -->
  <!-- ========================================== -->
  <div id="image-zoom-modal" class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/92 backdrop-blur-xl p-3 sm:p-6 transition-all duration-200 opacity-0 select-none">
    <div class="relative max-w-6xl w-full max-h-[94vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
      <div class="w-full flex items-center justify-between mb-3 px-1">
        <div class="flex items-center gap-2">
          <span id="zoom-type-badge" class="px-2.5 py-1 rounded-xl bg-sky-500/20 text-sky-300 border border-sky-500/30 text-xs font-semibold flex items-center gap-1.5">
            <svg id="zoom-type-icon-img" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5z"/></svg>
            <svg id="zoom-type-icon-video" class="w-3.5 h-3.5 hidden fill-current text-rose-400" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>

          </span>
          <span id="zoom-scale-indicator" class="text-xs text-slate-400 font-mono hidden sm:inline-block">100%</span>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" id="zoom-toggle-scale-btn" class="px-3 py-1.5 rounded-xl bg-slate-800/90 text-slate-300 text-xs font-semibold border border-slate-700">
            <span id="zoom-toggle-label">Увеличить</span>
          </button>
          <a id="zoom-open-original-btn" href="#" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-xl bg-slate-800/90 text-slate-300 text-xs font-semibold border border-slate-700">Оригинал</a>
          <button type="button" id="zoom-close-btn" class="px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-rose-600 text-slate-300 hover:text-white border border-slate-700 text-xs font-semibold">✕</button>
        </div>
      </div>
      <div id="zoom-viewport" class="relative w-full max-h-[76vh] overflow-auto rounded-2xl border border-white/10 bg-slate-950/80 shadow-2xl flex items-center justify-center p-2 cursor-pointer">
        <img id="zoom-modal-img" src="" alt="" class="max-h-[72vh] max-w-full object-contain rounded-lg" />
        <video id="zoom-modal-video" src="" controls playsinline preload="auto" class="max-h-[74vh] max-w-full rounded-lg hidden"></video>
      </div>
      <div id="zoom-modal-caption" class="mt-3 text-center text-xs sm:text-sm text-slate-300 font-medium px-4 line-clamp-2 max-w-4xl"></div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- PWA INSTALL GUIDE MODAL                    -->
  <!-- ========================================== -->
  <div id="pwa-install-modal" class="fixed inset-0 z-[9999] hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md transition-opacity duration-200 opacity-0">
    <div class="glass-panel rounded-3xl max-w-md w-full p-5 sm:p-6 border border-sky-500/30 shadow-2xl space-y-4" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-black text-white font-heading">📲 Установить AI News</h3>
        <button id="pwa-modal-close-btn" type="button" class="p-1.5 rounded-xl bg-slate-900 border border-slate-700 text-slate-300 text-xs">✕</button>
      </div>
      <div id="pwa-modal-body" class="text-xs text-slate-300 space-y-3"></div>
      <a id="pwa-open-https-btn" href="https://petroprog.tail703e6c.ts.net:8444" target="_blank" rel="noopener noreferrer"
        class="hidden w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold text-center block">
        Открыть по HTTPS и установить ↗
      </a>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Modular ES Modules Entry Point -->
  <script type="module" src="/js/main.js?v=2026_11_22_v4"></script>
